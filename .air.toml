# Live reload for the Go backend. Frontend HMR is handled separately by vite
# (`cd web && npm run dev`), which proxies /api and /stream to :8066.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/exit66jukebox ."
  entrypoint = "./tmp/exit66jukebox"
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "internal/web/dist", "docs", "packaging", "covers"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  delay = 200

[log]
  time = false

[misc]
  clean_on_exit = true
